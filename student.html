<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Student Portal - CLMSG</title>

<link rel="stylesheet" href="style.css">

<style>

.student-container {
    max-width: 400px;
    margin: 50px auto;
    padding: 25px;
    text-align: center;
}

.student-container input {
    width: 90%;
    padding: 12px;
    margin: 8px;
}

.student-container button {
    padding: 10px 20px;
    margin: 10px;
    cursor: pointer;
}

#otpSection,
#studentDashboard {
    display: none;
}

.alert-box {
    margin: 15px 0;
    padding: 10px;
}

</style>

</head>


<body>

<h1>College Library Management System</h1>


<!-- STUDENT LOGIN -->

<div id="loginSection" class="student-container">

    <h2>Student Login</h2>

    <input
        type="text"
        id="studentRoll"
        placeholder="Enter Roll Number">

    <input
        type="text"
        id="studentPhone"
        placeholder="Registered Mobile Number">

    <br>

    <button onclick="sendOTP()">
        Send OTP
    </button>


    <!-- OTP -->

    <div id="otpSection">

        <h3>OTP Verification</h3>

        <input
            type="text"
            id="studentOTP"
            placeholder="Enter OTP"
            maxlength="6">

        <br>

        <button onclick="verifyOTP()">
            Verify OTP
        </button>

    </div>

</div>


<!-- STUDENT DASHBOARD -->

<div id="studentDashboard" class="student-container">

    <h2>Student Dashboard</h2>

    <div id="studentDetails"></div>

    <div class="alert-box">

        <h3>🔔 Alerts</h3>

        <p id="alerts">
            No alerts
        </p>

    </div>


    <h3>Currently Issued Books</h3>

    <div id="issuedBooks">
        No books currently issued.
    </div>


    <br>

    <button onclick="logoutStudent()">
        Logout
    </button>

</div>


<script>

let demoOTP = "";


/* SEND OTP */

async function sendOTP() {

    const roll =
        document.getElementById("studentRoll").value.trim();

    const phone =
        document.getElementById("studentPhone").value.trim();

    if (!roll || !phone) {
        alert("Please enter Roll Number and Registered Mobile Number.");
        return;
    }

    try {

        const response = await fetch(
            "http://10.49.217.244:5000/api/student/send-otp",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    roll: roll,
                    phone: phone
                })
            }
        );

        const data = await response.json();

        if (!response.ok) {
            alert(data.message);
            return;
        }

        document.getElementById("otpSection").style.display = "block";

        alert("OTP generated. Check the Node.js terminal.");

    } catch (error) {

        alert("Unable to connect to CLMSG server.");

        console.error(error);

    }
}

/* VERIFY OTP */

async function verifyOTP() {

    const roll =
        document.getElementById("studentRoll").value.trim();

    const otp =
        document.getElementById("studentOTP").value.trim();

    if (!otp) {
        alert("Please enter OTP.");
        return;
    }

    try {

        const response = await fetch(
            "http://10.49.217.244:5000/api/student/verify-otp",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    roll: roll,
                    otp: otp
                })
            }
        );

        const data = await response.json();

        if (!response.ok) {
            alert(data.message);
            return;
        }

        document.getElementById("loginSection").style.display = "none";

        document.getElementById("studentDashboard").style.display = "block";

        document.getElementById("studentDetails").innerHTML =
            "<p>Name: " + data.student.name + "</p>" +
            "<p>Roll Number: " + data.student.roll + "</p>" +
            "<p>Branch: " + data.student.branch + "</p>";

        alert("Student login successful.");

    } catch (error) {

        alert("Unable to connect to CLMSG server.");

        console.error(error);

    }
}

/* LOGOUT */

function logoutStudent() {

    document
        .getElementById("studentDashboard")
        .style.display = "none";


    document
        .getElementById("loginSection")
        .style.display = "block";


    document
        .getElementById("studentOTP")
        .value = "";


    document
        .getElementById("otpSection")
        .style.display = "none";


    demoOTP = "";

}

</script>

</body>

</html>
