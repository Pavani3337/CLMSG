<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Student Portal - CLMSG</title>

<link rel="stylesheet" href="style.css">

<style>

.student-container {
    max-width: 400px;
    margin: 50px auto;
    padding: 25px;
    text-align: center;
}

.student-container input {
    width: 90%;
    padding: 12px;
    margin: 8px;
}

.student-container button {
    padding: 10px 20px;
    margin: 10px;
    cursor: pointer;
}

#otpSection,
#studentDashboard {
    display: none;
}

.alert-box {
    margin: 15px 0;
    padding: 10px;
}

</style>

</head>


<body>

<h1>College Library Management System</h1>


<!-- STUDENT LOGIN -->

<div id="loginSection" class="student-container">

    <h2>Student Login</h2>

    <input
        type="text"
        id="studentRoll"
        placeholder="Enter Roll Number">

    <input
        type="text"
        id="studentPhone"
        placeholder="Registered Mobile Number">

    <br>

    <button onclick="sendOTP()">
        Send OTP
    </button>


    <!-- OTP -->

    <div id="otpSection">

        <h3>OTP Verification</h3>

        <input
            type="text"
            id="studentOTP"
            placeholder="Enter OTP"
            maxlength="6">

        <br>

        <button onclick="verifyOTP()">
            Verify OTP
        </button>

    </div>

</div>


<!-- STUDENT DASHBOARD -->

<div id="studentDashboard" class="student-dashboard">

    <h2>Student Dashboard</h2>

    <div id="studentDetails"></div>

    <h3 id="bookCount">
        Books Issued: 0 / 4
    </h3>

    <hr>

    <h3>Currently Issued Books</h3>

    <div id="issuedBooks">
        Loading...
    </div>

    <hr>

    <h3>Borrowing History</h3>

    <div id="history">
        Loading...
    </div>

    <hr>

    <h3>Search Books</h3>

    <input
        type="text"
        id="bookSearch"
        placeholder="Enter book name">

    <button onclick="searchBooks()">
        Search
    </button>

    <div id="searchResults"></div>

    <br>

    <button onclick="logoutStudent()">
        Logout
    </button>

</div>

<script>

let demoOTP = "";


/* SEND OTP */

async function sendOTP() {

    const roll =
        document.getElementById("studentRoll").value.trim();

    const phone =
        document.getElementById("studentPhone").value.trim();

    if (!roll || !phone) {
        alert("Please enter Roll Number and Registered Mobile Number.");
        return;
    }

    try {

        const response = await fetch(
            "http://10.49.217.244:5000/api/student/send-otp",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    roll: roll,
                    phone: phone
                })
            }
        );

        const data = await response.json();

        if (!response.ok) {
            alert(data.message);
            return;
        }

        document.getElementById("otpSection").style.display = "block";

        alert("OTP generated. Check the Node.js terminal.");

    } catch (error) {

        alert("Unable to connect to CLMSG server.");

        console.error(error);

    }
}

/* VERIFY OTP */

async function verifyOTP() {

    const roll =
        document.getElementById("studentRoll").value.trim();

    const otp =
        document.getElementById("studentOTP").value.trim();

    if (!otp) {
        alert("Please enter OTP.");
        return;
    }

    try {

        const response = await fetch(
            "http://10.49.217.244:5000/api/student/verify-otp",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    roll: roll,
                    otp: otp
                })
            }
        );

        const data = await response.json();

        if (!response.ok) {
            alert(data.message);
            return;
        }

        document.getElementById("loginSection").style.display = "none";

document.getElementById("studentDashboard").style.display = "block";

loadStudentDashboard(data.student.roll);

        document.getElementById("studentDetails").innerHTML =
            "<p>Name: " + data.student.name + "</p>" +
            "<p>Roll Number: " + data.student.roll + "</p>" +
            "<p>Branch: " + data.student.branch + "</p>";

        alert("Student login successful.");

    } catch (error) {

        alert("Unable to connect to CLMSG server.");

        console.error(error);

    }
}

/* LOGOUT */

function logoutStudent() {

    document
        .getElementById("studentDashboard")
        .style.display = "none";


    document
        .getElementById("loginSection")
        .style.display = "block";


    document
        .getElementById("studentOTP")
        .value = "";


    document
        .getElementById("otpSection")
        .style.display = "none";


    demoOTP = "";

}








async function loadStudentDashboard(roll) {

    try {

        const response = await fetch(
            "http://10.49.217.244:5000/api/student/" +
            encodeURIComponent(roll) +
            "/dashboard"
        );

        const data = await response.json();

        if (!response.ok) {
            alert(data.message);
            return;
        }

        document.getElementById("studentDetails").innerHTML =
            "<p>Name: " + data.student.name + "</p>" +
            "<p>Roll Number: " + data.student.roll + "</p>" +
            "<p>Branch: " + data.student.branch + "</p>";

        document.getElementById("bookCount").innerText =
            "Books Issued: " +
            data.issuedBooks +
            " / " +
            data.bookLimit;


        /* CURRENT BOOKS */

        let issuedHTML = "";

        if (data.issued.length === 0) {

            issuedHTML =
                "<p>No books currently issued.</p>";

        } else {

            data.issued.forEach(book => {

                issuedHTML +=
                    "<p>" +
                    "<b>" + book.book_name + "</b><br>" +
                    "Author: " + (book.author || "-") + "<br>" +
                    "Issue Date: " + formatDate(book.issue_date) + "<br>" +
                    "Due Date: " + formatDate(book.due_date) +
                    "</p><hr>";

            });

        }

        document.getElementById("issuedBooks").innerHTML =
            issuedHTML;


        /* HISTORY */

        let historyHTML = "";

        if (data.history.length === 0) {

            historyHTML =
                "<p>No borrowing history.</p>";

        } else {

            data.history.forEach(book => {

                historyHTML +=
                    "<p>" +
                    "<b>" + book.book_name + "</b><br>" +
                    "Issue Date: " + formatDate(book.issue_date) + "<br>" +
                    "Return Date: " + formatDate(book.return_date) + "<br>" +
                    "Status: " + book.status +
                    "</p><hr>";

            });

        }

        document.getElementById("history").innerHTML =
            historyHTML;

    } catch (error) {

        console.error(error);

        alert("Unable to load student dashboard.");

    }

}







function formatDate(value) {

    if (!value) {
        return "-";
    }

    return String(value).split("T")[0];

}









</script>

</body>

</html>
