<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Student Portal - CLMSG</title>

<link rel="stylesheet" href="style.css">

<style>

.student-container {
    max-width: 1000px;
    margin: 30px auto;
    padding: 25px;
    text-align: center;
}

.student-container input {
    width: 90%;
    max-width: 500px;
    padding: 12px;
    margin: 8px;
    box-sizing: border-box;
}

.student-container button {
    padding: 10px 20px;
    margin: 10px;
    cursor: pointer;
}

#otpSection,
#studentDashboard {
    display: none;
}

.alert-box {
    margin: 15px 0;
    padding: 12px;
    border-radius: 8px;
}

.table-container {
    width: 100%;
    overflow-x: auto;
    margin: 15px 0;
}

.student-table {
    width: 100%;
    border-collapse: collapse;
    background: rgba(255, 255, 255, 0.85);
}

.student-table th,
.student-table td {
    border: 1px solid #999;
    padding: 10px;
    text-align: center;
}

.student-table th {
    background: #eeeeee;
    font-weight: bold;
}

.student-table tr:hover {
    background: #f5f5f5;
}

.status-issued {
    font-weight: bold;
}

.status-returned {
    font-weight: bold;
}

@media (max-width: 600px) {

    .student-container {
        padding: 10px;
    }

    .student-table th,
    .student-table td {
        padding: 7px;
        font-size: 13px;
        white-space: nowrap;
    }

}

</style>

</head>


<body>

<h1>College Library Management System</h1>


<!-- ================= STUDENT LOGIN ================= -->

<div id="loginSection" class="student-container">

    <h2>Student Login</h2>

    <input
        type="text"
        id="studentRoll"
        placeholder="Enter Roll Number">

    <input
        type="text"
        id="studentPhone"
        placeholder="Registered Mobile Number">

    <br>

    <button onclick="sendOTP()">
        Send OTP
    </button>


    <!-- OTP SECTION -->

    <div id="otpSection">

        <h3>OTP Verification</h3>

        <input
            type="text"
            id="studentOTP"
            placeholder="Enter OTP"
            maxlength="6">

        <br>

        <button onclick="verifyOTP()">
            Verify OTP
        </button>

    </div>

</div>


<!-- ================= STUDENT DASHBOARD ================= -->

<div id="studentDashboard" class="student-container">

    <h2>Student Dashboard</h2>

    <div id="studentDetails"></div>


    <h3 id="bookCount">
        Books Issued: 0 / 4
    </h3>


    <!-- DUE DATE ALERTS -->

    <div class="alert-box">

        <h3>🔔 Due-Date Alerts</h3>

        <div id="alerts">
            No alerts.
        </div>

    </div>


    <hr>


    <!-- CURRENTLY ISSUED BOOKS -->

    <h3>Currently Issued Books</h3>

    <div id="issuedBooks">
        Loading...
    </div>


    <hr>


    <!-- BORROWING HISTORY -->

    <h3>Borrowing History</h3>

    <div id="history">
        Loading...
    </div>


    <hr>


    <!-- BOOK SEARCH -->

    <h3>Search Books</h3>

    <input
        type="text"
        id="bookSearch"
        placeholder="Enter book name">

    <button onclick="searchBooks()">
        Search
    </button>

    <div id="searchResults"></div>


    <br>

    <button onclick="logoutStudent()">
        Logout
    </button>

</div>


<script>


/* ================= SEND OTP ================= */

async function sendOTP() {

    const roll =
        document
        .getElementById("studentRoll")
        .value
        .trim();

    const phone =
        document
        .getElementById("studentPhone")
        .value
        .trim();


    if (!roll || !phone) {

        alert(
            "Please enter Roll Number and Registered Mobile Number."
        );

        return;
    }


    try {

        const response = await fetch(

            "http://10.49.217.244:5000/api/student/send-otp",

            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({

                    roll: roll,

                    phone: phone

                })
            }

        );


        const data = await response.json();


        if (!response.ok) {

            alert(
                data.message ||
                "Unable to generate OTP."
            );

            return;
        }


        document
            .getElementById("otpSection")
            .style.display = "block";


        alert(
            "OTP generated. Check the Node.js terminal."
        );


    } catch (error) {

        console.error(error);

        alert(
            "Unable to connect to CLMSG server."
        );

    }

}


/* ================= VERIFY OTP ================= */

async function verifyOTP() {

    const roll =
        document
        .getElementById("studentRoll")
        .value
        .trim();

    const otp =
        document
        .getElementById("studentOTP")
        .value
        .trim();


    if (!otp) {

        alert("Please enter OTP.");

        return;
    }


    try {

        const response = await fetch(

            "http://10.49.217.244:5000/api/student/verify-otp",

            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({

                    roll: roll,

                    otp: otp

                })
            }

        );


        const data = await response.json();


        if (!response.ok) {

            alert(
                data.message ||
                "OTP verification failed."
            );

            return;
        }


        document
            .getElementById("loginSection")
            .style.display = "none";


        document
            .getElementById("studentDashboard")
            .style.display = "block";


        loadStudentDashboard(
            data.student.roll
        );


        alert(
            "Student login successful."
        );


    } catch (error) {

        console.error(error);

        alert(
            "Unable to connect to CLMSG server."
        );

    }

}


/* ================= LOAD DASHBOARD ================= */

async function loadStudentDashboard(roll) {

    try {

        const response = await fetch(

            "http://10.49.217.244:5000/api/student/" +
            encodeURIComponent(roll) +
            "/dashboard"

        );


        const data = await response.json();


        if (!response.ok) {

            alert(
                data.message ||
                "Unable to load dashboard."
            );

            return;
        }


        /* STUDENT DETAILS */

        document
            .getElementById("studentDetails")
            .innerHTML =

            "<p>Name: " +
            data.student.name +
            "</p>" +

            "<p>Roll Number: " +
            data.student.roll +
            "</p>" +

            "<p>Branch: " +
            data.student.branch +
            "</p>";


        /* BOOK COUNT */

        document
            .getElementById("bookCount")
            .innerText =

            "Books Issued: " +
            data.issuedBooks +
            " / " +
            data.bookLimit;


        /* CURRENT BOOKS */

        /* CURRENT BOOKS */

let issuedHTML = "";
let alertsHTML = "";

if (data.issued.length === 0) {

    issuedHTML =
        "<p>No books currently issued.</p>";

    alertsHTML =
        "<p>No alerts.</p>";

} else {

    issuedHTML =
        "<div class='table-container'>" +

        "<table class='student-table'>" +

        "<tr>" +
        "<th>Book</th>" +
        "<th>Author</th>" +
        "<th>Issue Date</th>" +
        "<th>Due Date</th>" +
        "<th>Status</th>" +
        "</tr>";


    data.issued.forEach(book => {

        issuedHTML +=

            "<tr>" +

            "<td>" +
            book.book_name +
            "</td>" +

            "<td>" +
            (book.author || "-") +
            "</td>" +

            "<td>" +
            formatDate(book.issue_date) +
            "</td>" +

            "<td>" +
            formatDate(book.due_date) +
            "</td>" +

            "<td class='status-issued'>" +
            book.status +
            "</td>" +

            "</tr>";


        const alert =
            getDueAlert(book.due_date);


        if (alert) {

            alertsHTML +=

                "<p>" +

                "<b>" +
                book.book_name +
                "</b> - " +

                alert +

                "</p>";

        }

    });


    issuedHTML +=

        "</table>" +
        "</div>";

}


document.getElementById("issuedBooks").innerHTML =
    issuedHTML;

document.getElementById("alerts").innerHTML =
    alertsHTML;



        /* BORROWING HISTORY */

        /* BORROWING HISTORY */

let historyHTML = "";

if (data.history.length === 0) {

    historyHTML =
        "<p>No borrowing history.</p>";

} else {

    historyHTML =

        "<div class='table-container'>" +

        "<table class='student-table'>" +

        "<tr>" +
        "<th>Book</th>" +
        "<th>Issue Date</th>" +
        "<th>Return Date</th>" +
        "<th>Status</th>" +
        "</tr>";


    data.history.forEach(book => {

        const statusClass =
            book.status === "Returned"
            ? "status-returned"
            : "status-issued";


        historyHTML +=

            "<tr>" +

            "<td>" +
            book.book_name +
            "</td>" +

            "<td>" +
            formatDate(book.issue_date) +
            "</td>" +

            "<td>" +
            formatDate(book.return_date) +
            "</td>" +

            "<td class='" +
            statusClass +
            "'>" +
            book.status +
            "</td>" +

            "</tr>";

    });


    historyHTML +=

        "</table>" +
        "</div>";

}


document.getElementById("history").innerHTML =
    historyHTML;


    } catch (error) {

        console.error(error);

        alert(
            "Unable to load student dashboard."
        );

    }

}


/* ================= DATE FORMAT ================= */

function formatDate(value) {

    if (!value) {

        return "-";

    }


    return String(value)
        .split("T")[0];

}


/* ================= DUE DATE ALERT ================= */

function getDueAlert(dueDate) {

    if (!dueDate) {

        return "";

    }


    /*
       MySQL DATE is YYYY-MM-DD.
       Create the date in local time to
       avoid timezone/date-shift problems.
    */

    const parts =
        String(dueDate)
        .split("T")[0]
        .split("-");


    if (parts.length !== 3) {

        return "";

    }


    const due =
        new Date(
            Number(parts[0]),
            Number(parts[1]) - 1,
            Number(parts[2])
        );


    const today =
        new Date();

    today.setHours(
        0,
        0,
        0,
        0
    );


    due.setHours(
        0,
        0,
        0,
        0
    );


    const difference =

        Math.round(
            (due - today) /
            (1000 * 60 * 60 * 24)
        );


    if (difference > 3) {

        return "";

    }


    if (difference === 3) {

        return "📚 Book is due in 3 days";

    }


    if (difference === 2) {

        return "📚 Book is due in 2 days";

    }


    if (difference === 1) {

        return "📚 Book is due tomorrow";

    }


    if (difference === 0) {

        return "⚠️ Book is due today";

    }


    return "🚨 Book is overdue by " +
           Math.abs(difference) +
           " day(s)";

}


/* ================= BOOK SEARCH ================= */

/*
   Step 5 will connect this function
   to the MySQL books API.
*/

function searchBooks() {

    alert(
        "Book search will be connected in the next step."
    );

}


/* ================= LOGOUT ================= */

function logoutStudent() {

    document
        .getElementById("studentDashboard")
        .style.display = "none";


    document
        .getElementById("loginSection")
        .style.display = "block";


    document
        .getElementById("studentRoll")
        .value = "";


    document
        .getElementById("studentPhone")
        .value = "";


    document
        .getElementById("studentOTP")
        .value = "";


    document
        .getElementById("otpSection")
        .style.display = "none";


    document
        .getElementById("studentDetails")
        .innerHTML = "";


    document
        .getElementById("issuedBooks")
        .innerHTML =
        "Loading...";


    document
        .getElementById("history")
        .innerHTML =
        "Loading...";


    document
        .getElementById("alerts")
        .innerHTML =
        "No alerts.";

}

</script>

</body>

</html>
