<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

<title>
Student Library Portal
</title>

<style>

body {
    font-family: Arial, sans-serif;
    background: #f4f6f8;
    margin: 0;
    padding: 20px;
}

.container {
    max-width: 900px;
    margin: auto;
    background: white;
    padding: 25px;
    border-radius: 12px;
}

input {
    width: 100%;
    padding: 12px;
    margin: 8px 0;
    box-sizing: border-box;
}

button {
    padding: 10px 18px;
    margin: 5px;
    border: none;
    border-radius: 6px;
    background: #2563eb;
    color: white;
    cursor: pointer;
}

button:hover {
    opacity: 0.9;
}

.hidden {
    display: none;
}

table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 20px;
}

th,
td {
    border: 1px solid #ddd;
    padding: 10px;
    text-align: center;
}

th {
    background: #f1f5f9;
}

.info {
    margin-top: 15px;
    padding: 15px;
    background: #f8fafc;
    border-radius: 8px;
}

.logout {
    background: #dc2626;
}

</style>

</head>

<body>

<div class="container">

<h1>
Student Library Portal
</h1>


<!-- LOGIN -->

<div id="studentLoginSection">

<h2>
Student Login
</h2>

<input
    id="studentLoginRoll"
    type="text"
    placeholder="Enter Roll Number">

<input
    id="studentLoginPhone"
    type="tel"
    placeholder="Registered Mobile Number">

<button
    onclick="sendStudentOTP()">

Send OTP

</button>


<div
    id="studentOTPArea"
    class="hidden">

<input
    id="studentOTP"
    type="text"
    maxlength="6"
    placeholder="Enter OTP">

<button
    onclick="verifyStudentOTP()">

Verify OTP

</button>

</div>

</div>


<!-- DASHBOARD -->

<div
    id="studentDashboard"
    class="hidden">

<h2>
My Library Profile
</h2>

<div class="info">

<p>
<strong>Name:</strong>
<span id="studentNameDisplay"></span>
</p>

<p>
<strong>Roll:</strong>
<span id="studentRollDisplay"></span>
</p>

<p>
<strong>Branch:</strong>
<span id="studentBranchDisplay"></span>
</p>

<p>
<strong>Current Books:</strong>
<span id="studentBookCount"></span>
</p>

</div>


<button
    onclick="downloadMyReport()">

Download My Report

</button>

<button
    class="logout"
    onclick="studentLogout()">

Logout

</button>


<h2>
My Book History
</h2>

<table>

<thead>

<tr>

<th>
#
</th>

<th>
Book
</th>

<th>
Author
</th>

<th>
Issue Date
</th>

<th>
Due Date
</th>

<th>
Status
</th>

<th>
Return Date
</th>

</tr>

</thead>

<tbody
    id="studentHistoryTable">

</tbody>

</table>

</div>

</div>


<script>

const API =
    "http://10.49.217.244:5000/api";


async function studentAPI(
    url,
    options = {}
) {

    const token =
        sessionStorage.getItem(
            "studentToken"
        );

    const headers =
        options.headers || {};

    if (token) {

        headers.Authorization =
            "Bearer " + token;
    }

    return fetch(
        url,
        {
            ...options,
            headers
        }
    );
}


async function sendStudentOTP() {

    const roll =
        document
            .getElementById(
                "studentLoginRoll"
            )
            .value
            .trim();

    const phone =
        document
            .getElementById(
                "studentLoginPhone"
            )
            .value
            .trim();

    if (!roll || !phone) {

        alert(
            "Enter roll number and registered mobile number"
        );

        return;
    }

    try {

        const response =
            await fetch(
                API +
                "/student/send-otp",
                {
                    method:
                        "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            roll,
                            phone
                        })
                }
            );

        const data =
            await response.json();

        if (!response.ok) {

            alert(
                data.error ||
                "Unable to send OTP"
            );

            return;
        }

        document
            .getElementById(
                "studentOTPArea"
            )
            .classList.remove(
                "hidden"
            );

        alert(
            "OTP sent to your registered mobile number."
        );

    } catch (error) {

        console.error(error);

        alert(
            "Backend is not reachable."
        );
    }
}


async function verifyStudentOTP() {

    const roll =
        document
            .getElementById(
                "studentLoginRoll"
            )
            .value
            .trim();

    const phone =
        document
            .getElementById(
                "studentLoginPhone"
            )
            .value
            .trim();

    const otp =
        document
            .getElementById(
                "studentOTP"
            )
            .value
            .trim();

    if (!otp) {

        alert(
            "Enter the OTP"
        );

        return;
    }

    try {

        const response =
            await fetch(
                API +
                "/student/verify-otp",
                {
                    method:
                        "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            roll,
                            phone,
                            otp
                        })
                }
            );

        const data =
            await response.json();

        if (!response.ok) {

            alert(
                data.error ||
                "Invalid OTP"
            );

            return;
        }

        sessionStorage.setItem(
            "studentToken",
            data.token
        );

        await loadDashboard();

    } catch (error) {

        console.error(error);

        alert(
            "Unable to verify OTP."
        );
    }
}


async function loadDashboard() {

    try {

        const response =
            await studentAPI(
                API +
                "/student/dashboard"
            );

        const data =
            await response.json();

        if (!response.ok) {

            sessionStorage.removeItem(
                "studentToken"
            );

            alert(
                data.error ||
                "Session expired"
            );

            return;
        }

        document
            .getElementById(
                "studentLoginSection"
            )
            .classList.add(
                "hidden"
            );

        document
            .getElementById(
                "studentDashboard"
            )
            .classList.remove(
                "hidden"
            );


        document
            .getElementById(
                "studentNameDisplay"
            )
            .textContent =
                data.student.name;

        document
            .getElementById(
                "studentRollDisplay"
            )
            .textContent =
                data.student.roll;

        document
            .getElementById(
                "studentBranchDisplay"
            )
            .textContent =
                data.student.branch;

        document
            .getElementById(
                "studentBookCount"
            )
            .textContent =
                data.issuedBooks +
                " / " +
                data.bookLimit;


        const table =
            document.getElementById(
                "studentHistoryTable"
            );

        table.innerHTML = "";


        data.history.forEach(
            (record, index) => {

                const row =
                    document.createElement(
                        "tr"
                    );

                row.innerHTML = `

                    <td>
                        ${index + 1}
                    </td>

                    <td>
                        ${record.book_name}
                    </td>

                    <td>
                        ${record.author || "-"}
                    </td>

                    <td>
                        ${formatDate(
                            record.issue_date
                        )}
                    </td>

                    <td>
                        ${formatDate(
                            record.due_date
                        )}
                    </td>

                    <td>
                        ${record.status}
                    </td>

                    <td>
                        ${formatDate(
                            record.return_date
                        )}
                    </td>

                `;

                table.appendChild(
                    row
                );
            }
        );

    } catch (error) {

        console.error(error);

        alert(
            "Unable to load dashboard."
        );
    }
}


function formatDate(date) {

    if (!date) {

        return "-";
    }

    return String(date)
        .split("T")[0];
}


function downloadMyReport() {

    const token =
        sessionStorage.getItem(
            "studentToken"
        );

    if (!token) {

        alert(
            "Please login first"
        );

        return;
    }

    studentAPI(
        API +
        "/student/dashboard"
    )
    .then(
        response =>
            response.json()
    )
    .then(
        data => {

            if (!data.history) {

                alert(
                    "Unable to create report"
                );

                return;
            }

            let content =
                "Student Library Report\n\n";

            content +=
                "Name: " +
                data.student.name +
                "\n";

            content +=
                "Roll: " +
                data.student.roll +
                "\n";

            content +=
                "Branch: " +
                data.student.branch +
                "\n";

            content +=
                "Current Books: " +
                data.issuedBooks +
                "/" +
                data.bookLimit +
                "\n\n";


            data.history.forEach(
                (record, index) => {

                    content +=
                        (index + 1) +
                        ". " +
                        record.book_name +
                        " | Issue: " +
                        formatDate(
                            record.issue_date
                        ) +
                        " | Due: " +
                        formatDate(
                            record.due_date
                        ) +
                        " | Return: " +
                        formatDate(
                            record.return_date
                        ) +
                        " | Status: " +
                        record.status +
                        "\n";
                }
            );


            const blob =
                new Blob(
                    [content],
                    {
                        type:
                            "text/plain"
                    }
                );

            const link =
                document.createElement(
                    "a"
                );

            link.href =
                URL.createObjectURL(
                    blob
                );

            link.download =
                data.student.roll +
                "_library_report.txt";

            link.click();

            URL.revokeObjectURL(
                link.href
            );
        }
    );
}


function studentLogout() {

    sessionStorage.removeItem(
        "studentToken"
    );

    location.reload();
}


window.onload =
    function () {

        if (
            sessionStorage.getItem(
                "studentToken"
            )
        ) {

            loadDashboard();
        }
    };

</script>

</body>

</html>
